name: Continuous Deployment - Backend

on:
  push:
    branches:
      - main
    paths:
      - 'server/**'
      - '.github/workflows/cd-backend.yml'

jobs:
  deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.0
        with:
          host: ${{ secrets.SERVER_IP }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            cd /var/www/CleanColoc
            git fetch origin main
            git reset --hard origin/main

            cd server
            docker build -t cleancoloc-backend:latest .

            docker stop cleancoloc-backend || true
            docker rm cleancoloc-backend || true

            docker run -d \
              --name cleancoloc-backend \
              --restart unless-stopped \
              --env-file /etc/cleancoloc/server.env \
              -p 127.0.0.1:3001:3001 \
              cleancoloc-backend:latest

            NODE_ENV=production \
            DATABASE_URL=$(grep DATABASE_URL /etc/cleancoloc/server.env | cut -d'=' -f2-) \
            npx sequelize-cli db:migrate